[project]
name = "doc-review-assistant"
version = "0.1.0"
description = "Regulated-document review assistant with a genuine include/exclude/uncertain state"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
anthropic = [
    "anthropic>=0.30",
]
openai = [
    "openai>=1.30",
]

[project.scripts]
doc-review = "doc_review.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
